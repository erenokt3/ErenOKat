<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SİSTEM UYARISI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid red;
            box-shadow: 0 0 30px red;
            transition: all 0.5s ease;
            min-width: 300px;
        }

        #hacking-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #warning-text {
            color: red;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 15px red;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-style {
            background-color: transparent;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
        }

        #stop-btn {
            border: 1px solid white;
        }

        #stop-btn:hover {
            background-color: red;
            border-color: red;
            box-shadow: 0 0 15px red;
        }

        #back-btn {
            border: 1px solid #4CAF50;
            color: #4CAF50;
            margin-top: 15px;
        }

        #back-btn:hover {
            background-color: #4CAF50;
            color: black;
            box-shadow: 0 0 15px #4CAF50;
        }

        #surprise {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #surprise p {
            color: #ff4d4d;
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 0 15px #ff4d4d;
            font-family: 'Arial', sans-serif;
        }

        /* Kodla çizilen SVG çiçek buketi */
        .bouquet-svg {
            width: 250px;
            height: 300px;
            filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.6));
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="overlay">
        <div id="hacking-ui">
            <div id="warning-text">HACKING ISLEMI BASLADI</div>
            <button id="stop-btn" class="btn-style">Hacking işlemini sonlandırmak için butona basın</button>
        </div>

        <div id="surprise">
            <p>Şaka şaka güzelim, al bunlar sana ❤️</p>
            
            <svg class="bouquet-svg" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
                <path d="M90 130 Q 80 190 95 240" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
                <path d="M100 130 Q 100 190 100 240" fill="none" stroke="#1b5e20" stroke-width="6" stroke-linecap="round"/>
                <path d="M110 130 Q 120 190 105 240" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
                
                <path d="M85 190 Q 100 180 115 190 Q 110 205 100 200 Q 90 205 85 190" fill="#d32f2f"/>
                <path d="M90 200 Q 80 220 70 230" fill="none" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
                <path d="M110 200 Q 120 220 130 230" fill="none" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
                
                <path d="M90 150 Q 50 130 70 170 Q 85 175 95 155" fill="#388e3c"/>
                <path d="M110 160 Q 150 130 130 180 Q 115 180 105 165" fill="#2e7d32"/>
                
                <g transform="translate(60, 95)">
                    <circle cx="0" cy="0" r="22" fill="#b71c1c"/>
                    <circle cx="0" cy="0" r="15" fill="#e53935"/>
                    <circle cx="0" cy="0" r="8" fill="#ff5252"/>
                    <path d="M-8 0 A8 8 0 0 1 8 0 A6 6 0 0 1 -4 4" fill="none" stroke="#ffcdd2" stroke-width="1" opacity="0.4"/>
                </g>
                
                <g transform="translate(140, 95)">
                    <circle cx="0" cy="0" r="22" fill="#b71c1c"/>
                    <circle cx="0" cy="0" r="15" fill="#d32f2f"/>
                    <circle cx="0" cy="0" r="8" fill="#ff5252"/>
                    <path d="M-8 0 A8 8 0 0 1 8 0 A6 6 0 0 1 -4 4" fill="none" stroke="#ffcdd2" stroke-width="1" opacity="0.4"/>
                </g>
                
                <g transform="translate(100, 65)">
                    <circle cx="0" cy="0" r="28" fill="#8e0000"/>
                    <circle cx="0" cy="0" r="21" fill="#c62828"/>
                    <circle cx="0" cy="0" r="14" fill="#f44336"/>
                    <circle cx="0" cy="0" r="7" fill="#ff8a80"/>
                    <path d="M-12 0 A12 12 0 0 1 12 0 A9 9 0 0 1 -6 6" fill="none" stroke="#ffcdd2" stroke-width="1.5" opacity="0.5"/>
                </g>
            </svg>

            <button id="back-btn" class="btn-style">Hack İşlemine Geri Dön</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()<>{}[]';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0'; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // Matrix efektini global bir değişkene atıyoruz ki durdurup başlatabilelim
        let matrixInterval = setInterval(drawMatrix, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops[x] = 1;
            }
        });

        // Sürprizi Göster (Hacki Durdur)
        document.getElementById('stop-btn').addEventListener('click', () => {
            document.getElementById('hacking-ui').style.display = 'none';
            document.getElementById('surprise').style.display = 'flex';
            
            document.getElementById('overlay').style.borderColor = '#ff4d4d';
            document.getElementById('overlay').style.boxShadow = '0 0 40px rgba(255, 77, 77, 0.5)';
            
            clearInterval(matrixInterval);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        // Hack Ekranına Geri Dön
        document.getElementById('back-btn').addEventListener('click', () => {
            document.getElementById('surprise').style.display = 'none';
            document.getElementById('hacking-ui').style.display = 'flex';
            
            document.getElementById('overlay').style.borderColor = 'red';
            document.getElementById('overlay').style.boxShadow = '0 0 30px red';
            
            // Ekranı temizle ve matrix'i yeniden başlat
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            matrixInterval = setInterval(drawMatrix, 35);
        });
    </script>
</body>
</html>
