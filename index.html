<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SİSTEM UYARISI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid red;
            box-shadow: 0 0 30px red;
            transition: all 0.5s ease;
            min-width: 400px;
        }

        #hacking-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #warning-text {
            color: red;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 15px red;
            animation: blink 1s infinite;
        }

        .question-text {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .button-group {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            height: 100px; /* Buton büyüdüğünde kaymaları önlemek için alan */
        }

        .btn-style {
            background-color: transparent;
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s, box-shadow 0.3s;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
        }

        #evet-btn {
            border: 1px solid #4CAF50;
            color: #4CAF50;
            transform-origin: center;
            position: relative;
            z-index: 20;
        }

        #evet-btn:hover {
            background-color: #4CAF50;
            color: black;
            box-shadow: 0 0 15px #4CAF50;
        }

        #hayir-btn {
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }

        #hayir-btn:hover {
            background-color: #ff4d4d;
            color: black;
            box-shadow: 0 0 15px #ff4d4d;
        }

        #result-ui {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        #result-ui p {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 0 10px white;
            font-family: 'Arial', sans-serif;
        }

        .wp-btn {
            background-color: #25D366;
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            font-size: 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.6);
            transition: 0.3s;
        }

        .wp-btn:hover {
            background-color: #1ebe57;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.9);
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="overlay">
        <div id="hacking-ui">
            <div id="warning-text">HACKING ISLEMI BASLADI</div>
            <div class="question-text">Hacklemeyi sonlandırmak istiyor musun?</div>
            <div class="button-group">
                <button id="evet-btn" class="btn-style">Evet</button>
                <button id="hayir-btn" class="btn-style">Hayır</button>
            </div>
        </div>

        <div id="result-ui">
            <p>O zaman Eren Okat ile WhatsApp'dan Konuşmaya Başla 😎</p>
            <a href="https://wa.me/905421467483" target="_blank" class="wp-btn">WhatsApp'a Git</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()<>{}[]';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0'; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        let matrixInterval = setInterval(drawMatrix, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops[x] = 1;
            }
        });

        // Buton Mantığı
        let evetScale = 1;
        const evetBtn = document.getElementById('evet-btn');
        const hayirBtn = document.getElementById('hayir-btn');

        // Hayır'a basılınca Evet'i büyüt
        hayirBtn.addEventListener('click', () => {
            evetScale += 0.5; // Her tıklamada 0.5 kat büyür
            evetBtn.style.transform = `scale(${evetScale})`;
        });

        // Evet'e basılınca Sonuç Ekranına geç
        evetBtn.addEventListener('click', () => {
            document.getElementById('hacking-ui').style.display = 'none';
            document.getElementById('result-ui').style.display = 'flex';
            
            // Çerçeve rengini WhatsApp yeşiline çevir
            document.getElementById('overlay').style.borderColor = '#25D366';
            document.getElementById('overlay').style.boxShadow = '0 0 40px rgba(37, 211, 102, 0.5)';
            
            // Matrix akışını durdur ve ekranı temizle
            clearInterval(matrixInterval);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
